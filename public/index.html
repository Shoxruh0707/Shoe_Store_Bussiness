<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oyoq kiyim ombori</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">Sotuvchi paneli</p>
          <h1>Ombor</h1>
        </div>
        <div class="status" id="status">Baza tekshirilmoqda...</div>
      </section>

      <section class="workspace">
        <form class="product-form" id="productForm">
          <div class="form-header">
            <div>
              <h2 id="formTitle">Mahsulot qo'shish</h2>
              <p>Yaratilgan va yangilangan vaqt avtomatik saqlanadi.</p>
            </div>
            <button class="ghost-button" type="button" id="resetButton">Yangi</button>
          </div>

          <input type="hidden" id="productId">

          <div class="field-grid">
            <label>
              <span>Artno</span>
              <input id="artNo" name="artNo" maxlength="50" required>
            </label>

            <label>
              <span>Rang</span>
              <input id="colour" name="colour" list="colourOptions" maxlength="20" required>
              <datalist id="colourOptions"></datalist>
            </label>

            <label>
              <span>Material</span>
              <input id="material" name="material" list="materialOptions" maxlength="10" required>
              <datalist id="materialOptions"></datalist>
            </label>

            <label>
              <span>Turi</span>
              <select id="type" name="type" required></select>
            </label>

            <label>
              <span>Narx</span>
              <input id="price" name="price" inputmode="numeric" required>
            </label>

            <label>
              <span>Kelish narxi</span>
              <input id="landingPrice" name="landingPrice" inputmode="numeric" required>
            </label>

            <label>
              <span>Nomi <em>ixtiyoriy</em></span>
              <input id="name" name="name" maxlength="50">
            </label>
          </div>

          <div class="image-block">
            <label>
              <span>Rasmlar <em>ixtiyoriy</em></span>
              <input id="images" name="images" type="file" accept="image/*" multiple>
            </label>
            <button class="ghost-button camera-open-button" type="button" id="openCameraButton">Kamera</button>
            <div class="image-list" id="imageList"></div>
          </div>

          <div class="season-block">
            <span>Mavsum</span>
            <div class="season-buttons" id="seasonButtons"></div>
          </div>

          <div class="inventory-block">
            <div class="inventory-title">
              <span>Razmer bo'yicha soni</span>
              <strong>Jami: <b id="totalQuantity">0</b></strong>
            </div>
            <div class="size-grid" id="sizeGrid"></div>
          </div>

          <div class="form-actions">
            <button class="primary-button" type="submit">Saqlash</button>
            <button class="danger-button" type="button" id="deleteButton" disabled>O'chirish</button>
          </div>
        </form>

        <section class="table-panel">
          <div class="table-header">
            <div>
              <h2>Mahsulotlar</h2>
              <p id="productCount">0 ta mahsulot</p>
            </div>
            <input id="search" placeholder="Artno, rang, material bo'yicha qidirish...">
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Artno</th>
                  <th>Rang</th>
                  <th>Material</th>
                  <th>Razmerlar</th>
                  <th>Soni</th>
                  <th>Narx</th>
                </tr>
              </thead>
              <tbody id="productsTable"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <div class="camera-panel" id="cameraPanel" hidden>
      <div class="camera-view">
        <video id="cameraVideo" autoplay playsinline></video>
        <canvas id="cameraCanvas" hidden></canvas>
        <div class="camera-actions">
          <button class="camera-done" type="button" id="cameraDoneButton" aria-label="Tayyor">✓</button>
          <button class="camera-shot" type="button" id="capturePhotoButton">Suratga olish</button>
          <button class="camera-close" type="button" id="closeCameraButton" aria-label="Yopish">×</button>
        </div>
        <div class="camera-strip" id="cameraStrip"></div>
      </div>
    </div>

    <template id="emptyRowTemplate">
      <tr>
        <td colspan="6" class="empty-cell">Hozircha mahsulot yo'q.</td>
      </tr>
    </template>

    <script src="/app.js"></script>
  </body>
</html>

name: admin-shoe-store

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-shoes_store_db}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./shoes_store_database_ddl.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging
    networks:
      - private

  backend:
    build:
      context: .
      target: backend
      args:
        REMBG_PRELOAD_MODEL: ${REMBG_PRELOAD_MODEL:-false}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-shoes_store_db}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_AUTH_MAX_AGE_SECONDS: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:-86400}
      FRONTEND_URL: ${PUBLIC_URL:-https://${DOMAIN:?Set DOMAIN in .env}}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:?Set DOMAIN in .env}}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN:?Set DOMAIN in .env}}
      SESSION_COOKIE_SECURE: "true"
      DEFAULT_STORE_ID: ${DEFAULT_STORE_ID:-1}
      DEFAULT_STORE_NAME: ${DEFAULT_STORE_NAME:-Default Store}
      DEFAULT_OWNER_PHONE: ${DEFAULT_OWNER_PHONE:-+998000000001}
      DEFAULT_OWNER_PASSWORD_HASH: ${DEFAULT_OWNER_PASSWORD_HASH:-}
      DEFAULT_BRAND_NAME: ${DEFAULT_BRAND_NAME:-Unbranded}
      REMBG_ENABLED: ${REMBG_ENABLED:-true}
      REMBG_PYTHON: ${REMBG_PYTHON:-/app/.venv/bin/python}
      REMBG_SCRIPT: ${REMBG_SCRIPT:-/app/scripts/remove_background.py}
      REMBG_BACKEND: ${REMBG_BACKEND:-bria}
      REMBG_DEVICE: ${REMBG_DEVICE:-cpu}
      REMBG_BRIA_IMAGE_SIZE: ${REMBG_BRIA_IMAGE_SIZE:-1024}
      REMBG_METRICS: ${REMBG_METRICS:-true}
      REMBG_ESTIMATED_CPU_WATTS: ${REMBG_ESTIMATED_CPU_WATTS:-35}
      REMBG_TIMEOUT_MS: ${REMBG_TIMEOUT_MS:-300000}
      REMBG_MODEL: ${REMBG_MODEL:-briaai/RMBG-2.0}
      REMBG_STARTUP_RETRY_LIMIT: ${REMBG_STARTUP_RETRY_LIMIT:-50}
      U2NET_HOME: /app/.u2net
      HF_HOME: /app/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - uploads:/app/public/uploads
      - hf_cache:/app/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - private

  frontend:
    build:
      context: .
      target: frontend
      args:
        BACKEND_API_URL: http://backend:3000/api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: http://backend:3000/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - private

  bot:
    build:
      context: .
      target: bot
      args:
        REMBG_PRELOAD_MODEL: ${REMBG_PRELOAD_MODEL:-false}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-shoes_store_db}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-https://${DOMAIN:?Set DOMAIN in .env}/inventory}
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-25}
      DEFAULT_OWNER_PASSWORD_HASH: ${DEFAULT_OWNER_PASSWORD_HASH:-}
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - private

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      CADDY_DOMAINS: ${CADDY_DOMAINS:-${DOMAIN:?Set DOMAIN in .env}}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - private

volumes:
  mysql_data:
  uploads:
  hf_cache:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge

name: admin-shoe-store

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-shoes_store_db}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging
    networks:
      - private

  migrate:
    build:
      context: .
      target: backend
    command: ["node", "scripts/migrate.js", "apply"]
    restart: "no"
    environment:
      MIGRATION_DB_HOST: mysql
      MIGRATION_DB_PORT: 3306
      MIGRATION_DB_NAME: ${DB_NAME:-shoes_store_db}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-root}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}}
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - private

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-shoes_store_db}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED:-true}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:?Set DOMAIN in .env}}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SESSION_COOKIE_SECURE: "true"
      DEFAULT_STORE_ID: ${DEFAULT_STORE_ID:-1}
      DEFAULT_STORE_NAME: ${DEFAULT_STORE_NAME:-Default Store}
      DEFAULT_OWNER_PHONE: ${DEFAULT_OWNER_PHONE:-+998000000001}
      DEFAULT_OWNER_PASSWORD_HASH: ${DEFAULT_OWNER_PASSWORD_HASH:-}
      DEFAULT_BRAND_NAME: ${DEFAULT_BRAND_NAME:-Unbranded}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - private

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_DOMAINS: ${CADDY_DOMAINS:-${DOMAIN:?Set DOMAIN in .env}}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - private

volumes:
  mysql_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      BACKGROUND_REMOVAL_URL: http://image-processor:7000
      BACKGROUND_REMOVAL_REQUIRED: "true"
    volumes:
      - uploads:/app/public/uploads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      image-processor:
        condition: service_healthy

  image-processor:
    build:
      context: ./image-processor
    restart: unless-stopped
    environment:
      REMBG_MODEL: u2net
      MAX_IMAGE_BYTES: 5242880
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:3000/api
      HOSTNAME: 0.0.0.0
    ports:
      - "3001:3001"
    depends_on:
      - backend

  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - bot

volumes:
  postgres_data:
  uploads:
